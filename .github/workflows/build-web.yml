name: Build and publish Godot Web game

on:
  workflow_dispatch:
  push:
    paths:
      - "littlehistory-update.zip"
      - "littlehistory-changed-scripts.zip"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.7.2"
          mkdir -p "$RUNNER_TEMP/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 2 -type f -name 'Godot_v*linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/$GODOT_BIN" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir templates
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Extract base project and apply changed scripts
        shell: bash
        run: |
          set -euxo pipefail
          test -s littlehistory-update.zip
          test -s littlehistory-changed-scripts.zip
          mkdir -p source/base source/patch
          unzip -q littlehistory-update.zip -d source/base
          unzip -q littlehistory-changed-scripts.zip -d source/patch
          PROJECT_FILE="$(find source/base -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          for script in game.gd title_screen.gd lh_hero.gd lh_item.gd lh_gizmo.gd; do
            PATCH_FILE="$(find source/patch -type f -name "$script" -print -quit)"
            test -n "$PATCH_FILE"
            install -D "$PATCH_FILE" "$PROJECT_DIR/scripts/$script"
          done
          mkdir -p "$PROJECT_DIR/dist"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Import project resources
        shell: bash
        run: |
          set -euxo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$PROJECT_DIR/dist"
          mkdir -p "$OUTPUT_DIR"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-release "Web" "$OUTPUT_DIR/index.html"
          test -s "$OUTPUT_DIR/index.html"
          find "$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f %s bytes\\n'
          echo "EXPORT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: export-web
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
